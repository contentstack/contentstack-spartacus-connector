name: CodeQL Source Scan

# Static security analysis of the actual TypeScript source (adapters,
# normalizers, live-preview, client, schematics). JS/TS CodeQL analysis needs
# no build step, so this needs neither `npm ci` nor the private @spartacus
# registry secret ci.yml requires.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly, so newly-disclosed query/advisory coverage still runs against
    # unchanged code, not just on the next push.
    - cron: '0 3 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
