name: Publish to npm

# Publishes @contentstack/contentstack-spartacus-connector to the public npm
# registry when a GitHub Release is published, using npm trusted publishing
# (OIDC): GitHub issues a short-lived OIDC token and npm exchanges it for a
# publish credential at publish time. No npm token secret is used.
# Docs: https://docs.npmjs.com/trusted-publishers
#
# npm-side setup (once, by a package maintainer on npmjs.com):
#   Package settings -> Trusted publishing -> GitHub Actions:
#     - Organization or user: contentstack
#     - Repository:           contentstack-spartacus-connector
#     - Workflow filename:    release.yml   (exact, case-sensitive)
#     - Environment:          (leave blank)
#   Then, once a publish through this workflow has worked: Publishing access ->
#   "Require two-factor authentication and disallow tokens", and revoke old
#   automation tokens.
#
# Requirements (from the npm docs): GitHub-hosted runner, `id-token: write`,
# npm CLI >= 11.5.1 and Node >= 22.14.0.
#
# Provenance: the publish step passes `--provenance` explicitly. Trusted
# publishing would add it on its own, but with the flag npm refuses to publish
# at all if it can't sign the provenance statement, so this public package is
# never published without one. It needs `id-token: write` and a
# package.json `repository.url` that matches this repo (both are set).

on:
  release:
    types: [published]
  # Manual run, e.g. to publish a version whose release-triggered run failed.
  # npm refuses to publish a version that already exists, so a re-run can't
  # overwrite a published version.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # latest 22.x, which meets the >= 22.14.0 requirement
          registry-url: 'https://registry.npmjs.org'

      # npm's OIDC trusted-publishing support requires npm >= 11.5.1;
      # actions/setup-node@v4 on node 22 currently bundles an older npm.
      # Pinned to the 11.x line (not `latest`/npm 12) because npm 12 defaults
      # `allow-remote=none`, which rejects installing @spartacus/* from the
      # SAP RBSC registry (its package-lock.json entries resolve to raw
      # tarball URLs, not plain registry packages) — see EALLOWREMOTE.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      # Configure SAP RBSC registry auth for build dependencies
      - name: Configure SAP RBSC registry auth
        run: |
          {
            echo "legacy-peer-deps=true"
            echo "//73554900100900004337.npmsrv.cdn.repositories.cloud.sap/:_auth=$RBSC_NPM_AUTH"
          } > .npmrc
        env:
          RBSC_NPM_AUTH: ${{ secrets.RBSC_NPM_AUTH }}

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      # Trusted publishing: npm detects the GitHub Actions OIDC environment and
      # authenticates with it. No NODE_AUTH_TOKEN / NPM_TOKEN is passed here.
      # --provenance: sign and attach a provenance statement, and fail the
      # publish if it can't be generated.
      - name: Publish to npm (trusted publishing, OIDC, with provenance)
        working-directory: dist
        run: npm publish --access public --provenance
