name: Publish to npm

# Publishes @contentstack/contentstack-spartacus-connector to the public npm
# registry whenever a GitHub Release is published. Uses npm's OIDC trusted
# publisher flow: GitHub issues a short-lived OIDC token that npm exchanges
# for a publish token at publish time. No token secret is needed for ongoing
# publishes once bootstrap (below) is complete and removed.
#
# ONE-TIME BOOTSTRAP INSTRUCTIONS (only needed because the package has never
# been published before — npm has no page to configure a Trusted Publisher
# for a package that doesn't exist yet):
#  1. Add a temporary secret named `NPM_TOKEN` in Repo Settings -> Secrets.
#  2. Run this workflow manually via Actions -> "Publish to npm" -> "Run workflow".
#  3. Go to npmjs.com -> package settings -> Publishing access and set up
#     Trusted Publisher for:
#       - Repo: contentstack/contentstack-spartacus-connector
#       - Workflow: release.yml
#  4. Delete the `NPM_TOKEN` secret from GitHub repository settings.
#  5. Future publishes will run automatically on GitHub Release via OIDC.

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger for the one-time bootstrap publish

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    # secrets.* can't be used directly in `if:` conditionals (GitHub Actions
    # doesn't recognize the secrets context there), so the bootstrap token's
    # presence is surfaced as a job-level env var and the steps below branch
    # on that instead.
    env:
      HAS_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm's OIDC trusted-publishing support requires npm >= 11.5.1;
      # actions/setup-node@v4 on node 22 currently bundles an older npm.
      # Pinned to the 11.x line (not `latest`/npm 12) because npm 12 defaults
      # `allow-remote=none`, which rejects installing @spartacus/* from the
      # SAP RBSC registry (its package-lock.json entries resolve to raw
      # tarball URLs, not plain registry packages) — see EALLOWREMOTE.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      # Configure SAP RBSC registry auth for build dependencies
      - name: Configure SAP RBSC registry auth
        run: |
          {
            echo "legacy-peer-deps=true"
            echo "//73554900100900004337.npmsrv.cdn.repositories.cloud.sap/:_auth=$RBSC_NPM_AUTH"
          } > .npmrc
        env:
          RBSC_NPM_AUTH: ${{ secrets.RBSC_NPM_AUTH }}

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      # Step A: OIDC publish — runs automatically on Release, and on any
      # manual run once the NPM_TOKEN bootstrap secret has been deleted.
      - name: Publish to npm (OIDC)
        if: env.HAS_BOOTSTRAP_TOKEN != 'true'
        working-directory: dist
        run: npm publish --access public --provenance

      # Step B: one-time bootstrap publish — runs only while NPM_TOKEN
      # exists, to claim the package name before a Trusted Publisher can be
      # configured for it. Delete the secret right after this succeeds.
      - name: Publish to npm (one-time bootstrap token)
        if: env.HAS_BOOTSTRAP_TOKEN == 'true'
        working-directory: dist
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
